<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC 💗</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{background:#111;transition:background 1s ease}
  .screen{
    position:relative;width:100%;height:100%;height:100svh;min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));overflow:hidden;background-size:cover;background-position:center;
  }
  .screen::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:0;transition:background .8s}
  .card{
    position:relative;z-index:3;width:min(680px,94vw);max-height:calc(100svh - 32px);overflow:auto;padding:34px 26px 30px;border-radius:28px;
    text-align:center;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 70px rgba(0,0,0,.28);
  }
  .emoji{font-size:42px;margin-bottom:8px}
  h1{font-size:clamp(25px,6vw,42px);line-height:1.15;margin:8px 0 14px}
  p{font-size:18px;line-height:1.5;margin:0 auto 26px;max-width:580px}
  .buttons{display:flex;gap:18px;justify-content:center;align-items:center;min-height:64px}
  button{
    border:0;border-radius:999px;padding:15px 30px;font-size:18px;font-weight:700;cursor:pointer;-webkit-user-select:none;user-select:none;
    box-shadow:0 8px 22px rgba(0,0,0,.2);transition:transform .18s,box-shadow .18s;
    touch-action:manipulation;
  }
  #yes{background:#fff;color:#e91e63}
  #no{background:#222;color:#fff;position:relative}
  button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.28)}
  .progress{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:4;font-weight:700;color:#fff;opacity:.9}
  .hint{font-size:13px;opacity:.8;margin-top:18px}
  .hidden{display:none!important}
  .final{background:linear-gradient(135deg,#ff7eb3,#ff4f81,#ffb3d1)}
  .final::before{background:rgba(255,75,130,.08)}
  .final-card{background:rgba(255,255,255,.22)}
  .final h1{font-size:clamp(30px,8vw,54px)}
  .heart{
    position:absolute;bottom:-50px;font-size:24px;animation:floatUp linear forwards;z-index:1;pointer-events:none;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.12));
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.8) rotate(0deg);opacity:0}
    12%{opacity:1}
    100%{transform:translateY(-115vh) scale(1.5) rotate(360deg);opacity:0}
  }
  .music-note{font-size:14px;margin-top:18px;opacity:.9;cursor:pointer}
  #audioPicker{display:none}
  .music-btn{background:rgba(255,255,255,.85);color:#e91e63;padding:11px 18px;font-size:14px;margin-top:10px}
  @media(max-width:480px){
  .screen{padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  .card{width:100%;max-width:430px;max-height:calc(100svh - 24px);padding:24px 16px 22px;border-radius:22px}
  h1{font-size:clamp(24px,7vw,34px)}
  p{font-size:16px;margin-bottom:20px}
  .buttons{gap:10px;flex-wrap:wrap}
  button{min-height:52px;padding:14px 22px;font-size:17px}
  .emoji{font-size:34px}
  .progress{top:calc(10px + env(safe-area-inset-top));font-size:14px}
}.buttons{gap:10px}button{padding:14px 23px}.emoji{font-size:35px}}
</style>
</head>
<body>
<div id="app" class="screen">
  <div id="progress" class="progress">Question 1 of 3 💗</div>
  <main class="card" id="card">
    <div class="emoji" id="emoji">🥺</div>
    <h1 id="question"></h1>
    <p id="subtext"></p>
    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No 😭</button>
    </div>
    <div class="hint">P.S. Try clicking “No” if you dare 😏</div>
  </main>
</div>

<script>
const app = document.getElementById("app");
const q = document.getElementById("question");
const sub = document.getElementById("subtext");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const emoji = document.getElementById("emoji");
const progress = document.getElementById("progress");
const card = document.getElementById("card");

let step = 0;
let dodgeCount = 0;

const questions = [
  {
    text:"Do you feel complete in your life? 🥺",
    sub:"Be honest… there might be one tiny piece missing. 👀",
    emoji:"🥺",
    bg:"linear-gradient(135deg,#667eea,#764ba2)"
  },
  {
    text:"I know baddie… there is space for daddie in your heart 😉😉 !!<br>Do you want to date him?",
    sub:"You already know which answer the universe is expecting. 😌",
    emoji:"😏",
    bg:"linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.38)), url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1800&q=85')"
  },
  {
    text:"Ohhhhh, now you are on the final stage…<br>so you really think he loves you the most? 🤭🤭",
    sub:"This is the final boss. Choose wisely. 💘",
    emoji:"🤭",
    bg:"linear-gradient(135deg,#8e2de2,#4a00e0)"
  }
];

function loadStep(){
  const item = questions[step];
  q.innerHTML=item.text;
  sub.textContent=item.sub;
  emoji.textContent=item.emoji;
  progress.textContent=`Question ${step+1} of 3 💗`;
  app.style.backgroundImage=item.bg;
  app.classList.remove("final");
  card.classList.remove("final-card");
  yes.textContent="Yes 💕";
  no.textContent="No 😭";
  no.style.position="relative";
  no.style.left="0";
  no.style.top="0";
  no.style.transform="";
  dodgeCount=0;
}

function dodgeNo(){
  dodgeCount++;
  // On mobile, keep the button inside the viewport while making it unpredictably move.
  const pad=12;
  const maxX=Math.max(40, Math.min(window.innerWidth*.38, 190));
  const maxY=Math.max(35, Math.min(window.innerHeight*.22, 150));
  const x=(Math.random()*2-1)*maxX;
  const y=(Math.random()*2-1)*maxY;
  no.style.position="relative";
  no.style.transform=`translate(${x}px,${y}px) rotate(${(Math.random()*10-5).toFixed(1)}deg)`;
  if(dodgeCount>=3) no.textContent=["No 😭","Nice try 😏","Nope 😂","Not today 💀"][Math.floor(Math.random()*4)];
}

no.addEventListener("pointerdown",(e)=>{
  e.preventDefault();
  dodgeNo();
});

yes.addEventListener("click",()=>{
  if(step<2){
    step++;
    loadStep();
  }else{
    showFinal();
  }
});

  progress.classList.add("hidden");
  card.innerHTML=`

    <p>Officially approved by the universe, the Eiffel Tower, and this very suspicious questionnaire. 😌</p>

  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["💗","💖","💕","💘","❤️","💓"][Math.floor(Math.random()*6)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(18+Math.random()*30)+"px";
  h.style.animationDuration=(4+Math.random()*5)+"s";
  app.appendChild(h);
  setTimeout(()=>h.remove(),9500);
}

loadStep();
</script>
